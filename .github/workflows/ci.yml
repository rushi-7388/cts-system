name: CTS Full-Stack & DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-backend:
    name: Backend Lint, Schema & Health Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cts
          POSTGRES_PASSWORD: cts_password
          POSTGRES_DB: cts_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Validate Backend JavaScript Syntax
        working-directory: ./backend
        run: |
          find src prisma -name "*.js" -exec node -c {} +

      - name: Generate Prisma Client & Push Schema
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://cts:cts_password@localhost:5432/cts_system?schema=public"
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Database Seeding Test
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://cts:cts_password@localhost:5432/cts_system?schema=public"
        run: node prisma/seed.js

      - name: Execute Standalone DB Health Diagnostic
        env:
          DATABASE_URL: "postgresql://cts:cts_password@localhost:5432/cts_system?schema=public"
        run: node scripts/db-health.js

  validate-frontend:
    name: Frontend Build & Bundle Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Production Vite Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        working-directory: ./frontend
        run: |
          test -f dist/index.html || exit 1
          echo "Vite distribution build verified successfully."

  security-scan:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend Security Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Frontend Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  docker-compose-validation:
    name: Multi-Container Docker Build Check
    runs-on: ubuntu-latest
    needs: [validate-backend, validate-frontend]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Stack Images
        run: docker compose build
