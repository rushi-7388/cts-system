apiVersion: v1
kind: ConfigMap
metadata:
  name: cts-config
  namespace: cts-system
data:
  PORT: "5000"
  NODE_ENV: "production"
  SEED_DB: "true"
  LSM_DAEMON_INTERVAL_MS: "15000"
  PQC_SECURITY_LEVEL: "NIST_CATEGORY_3"
  ZKP_CURVE: "BN254"
  CBDC_GATEWAY_NODE: "rbi-cbdc-wholesale-gateway"
  SANCTIONS_RADAR_MODE: "ENFORCE_STRICT"
  PROMETHEUS_METRICS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: cts-secret
  namespace: cts-system
type: Opaque
stringData:
  POSTGRES_USER: "cts"
  POSTGRES_PASSWORD: "cts_password"
  POSTGRES_DB: "cts_system"
  DATABASE_URL: "postgresql://cts:cts_password@postgres-service:5432/cts_system?schema=public"
  JWT_SECRET: "enterprise_production_jwt_secret_change_me_in_vault"
