global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "cts-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000"]
        labels:
          application: "cts-system"
          environment: "production"
          region: "in-west-1"
          grid: "national-clearing-grid"
